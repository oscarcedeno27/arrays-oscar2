<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de números</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <h1>Operaciones con arrays</h1>
    <a href="index.html">Volver al menú</a>

    <form id="formulario">
        <input type="number" id="numero" placeholder="Ingrese un número" step="any">
        <button type="submit" id="btnAgregar">Agregar número</button>
    </form>

    <h2>Números registrados</h2>
    <ul id="lista"></ul>

    <h2>Resultados</h2>
    <p id="suma"></p>
    <p id="promedio"></p>
    <p id="mayor"></p>
    <p id="menor"></p>

    <script src="js/ejercicio2.js"></script>
</body>
</html>
