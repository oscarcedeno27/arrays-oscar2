<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de productos</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <h1>Inventario de productos</h1>
    <a href="index.html">Volver al menú</a>

    <form id="formulario">
        <label for="producto">Nombre del producto:</label>
        <input type="text" id="producto" required>

        <label for="precio">Precio unitario:</label>
        <input type="number" id="precio" min="0" step="any" required>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" min="1" step="1" required>

        <button type="submit" id="btnAgregar">Agregar producto</button>
    </form>

    <h2>Productos registrados</h2>
    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio unitario</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>

    <h2>Resultados</h2>
    <p id="total"></p>
    <p id="productoMayor"></p>

    <script src="js/ejercicio3.js"></script>
</body>
</html>
